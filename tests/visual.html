<!doctype html><html lang="en"><meta charset="utf-8"><title>LOW visual regression capture</title>
<style>html,body{margin:0;background:#18271b}#world{width:960px;height:540px}#status{position:fixed;top:0;left:0;color:white;background:#0009;font:12px monospace;z-index:2}</style>
<div id="world"></div><div id="status">Initializing deterministic visual comparison</div>
<script type="module">
import { Countryside } from '../src/scene.js';
const q = new URLSearchParams(location.search);
const profiles = { desktop:[960,540,1], mobile:[390,844,2], wide:[1280,720,1] };
const profile = profiles[q.get('profile') || 'desktop'];
const time = q.get('time') || 'day', spot = Number(q.get('spot') || 0);
const run = q.get('run') || 'review', base = q.get('collector');
const status = document.querySelector('#status');
const root = document.querySelector('#world');
const results = [];
try {
  if (!profile || !['morning','day','evening'].includes(time) || ![0,1,2].includes(spot)) throw new Error('Invalid capture parameters');
  root.style.width = `${profile[0]}px`; root.style.height = `${profile[1]}px`;
  Object.defineProperty(window, 'devicePixelRatio', { configurable:true, value:profile[2] });
  const world = new Countryside(root);
  world.renderer.setAnimationLoop(null);
  world.setQuality('low');
  world.camera.fov = profile[0] < 760 ? 64 : 59;
  world.setTime(time);
  // Freeze all animation. Images in a pair use the exact same scene state.
  world.elapsed = 12; world.windUniform.value = 12;
  world.water.material.normalMap.offset.set(.036,.024);
  const start = performance.now();
  while (![world.materials.grass.map,world.materials.path.map].every(t=>t.image?.complete)) {
    if(performance.now()-start>30000)throw new Error('Textures failed to load');
    await new Promise(r=>setTimeout(r,50));
  }
  const angles = q.has('probe') ? [0] : [0, -0.55, 0.55, -1.05, 1.05];
  world.goTo(spot,true);
  const position = world.transition.end.clone(), yaw = world.transition.endYaw, pitch = world.transition.endPitch;
  world.transition = null;
  const gl=world.renderer.getContext(), ext=gl.getExtension('WEBGL_debug_renderer_info');
  const renderer=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
  // Render every HDR view before LOW, avoiding repeated 4K shadow reallocations.
  for(const quality of ['hdr','low']) {
    world.setQuality(quality);
    if(world.quality!==quality)throw new Error(`Quality fallback: ${quality} -> ${world.quality}`);
    for(let angle=0;angle<angles.length;angle++) {
      world.camera.position.copy(position);
      world.camera.rotation.set(angle===3?pitch-.22:angle===4?pitch+.12:pitch,yaw+angles[angle],0,'YXZ');
      world.renderer.shadowMap.needsUpdate=true;
      const pixel=new Uint8Array(4), sync=()=>gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
      world.render();sync(); // Shader and resource warmup is not measured.
      const timings=[];
      const n=q.has('benchmark')?9:1;
      for(let i=0;i<n;i++) {
        world.renderer.shadowMap.needsUpdate=true; // Exclude caching from the claimed saving.
        const t=performance.now();world.render();sync();timings.push(performance.now()-t);
      }
      if(gl.isContextLost()||gl.getError()!==gl.NO_ERROR)throw new Error('WebGL capture failed');
      // Compare at identical display size; browser scaling is part of the preset.
      const image=document.createElement('canvas');image.width=profile[0]*profile[2];image.height=profile[1]*profile[2];
      image.getContext('2d').drawImage(world.renderer.domElement,0,0,image.width,image.height);
      const name=`${run}-${q.get('profile')||'desktop'}-${time}-${spot}-${angle}-${quality}`;
      const result={name,quality,profile:profile.slice(),time,spot,angle,renderer,timings,
        shadowSizes:world.lighting.csm.lights.map(l=>l.shadow.mapSize.x),
        drawingBuffer:[world.renderer.domElement.width,world.renderer.domElement.height],
        blades:world.rice.userData.bladeCount,png:image.toDataURL('image/png')};
      if(base) {
        const response=await fetch(`${base}/capture`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
        if(!response.ok)throw new Error('Capture storage failed');
      }
      delete result.png; results.push(result);
      status.textContent=`Captured ${name}`;console.log(`CAPTURED ${name}`);
      await new Promise(r=>setTimeout(r,0));
    }
  }
  status.id='done';status.textContent=`PASS ${results.length} captures`;
  console.log(JSON.stringify({status:'PASS',captures:results.length,renderer}));
} catch(error) {
  status.id='failed';status.textContent=error.stack;console.error(error.stack);
  if(base)await fetch(`${base}/capture`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:`${run}-error-${time}-${spot}`,error:error.stack})}).catch(()=>{});
}
</script></html>
